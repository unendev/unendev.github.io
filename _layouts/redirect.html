<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="{{ page.redirect_to }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to }}">
    <title>{{ page.title }} · 文章已迁移</title>
  </head>
  <body>
    <main>
      <h1>{{ page.title }}</h1>
      <p>这篇文章已整理进专题新版，正在跳转。</p>
      <p><a href="{{ page.redirect_to }}">如果没有自动跳转，请打开新版文章</a></p>
    </main>
    <script>window.location.replace({{ page.redirect_to | jsonify }});</script>
  </body>
</html>
